version: 0.2

env:
  runtime-versions:
    nodejs: 22
  variables:
    NODE_ENV: production

phases:
  install:
    commands:
      - echo Installing dependencies...
      - npm ci
  build:
    commands:
      - echo Running build for Vite React app...
      - npm run build

artifacts:
  base-directory: dist
  files:
    - '**/*'
